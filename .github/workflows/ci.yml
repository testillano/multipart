name: CI
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker images tag'
        required: true
  push:
    branches:
      - master
    tags:
      - v*.*.*
  pull_request:
    branches:
      - master

jobs:
  format_style:
    name: Check source code format
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run frankwolf format
      run: |
          sources=$(find . -name "*.hpp" -o -name "*.cpp")
          ! docker run -i --rm -v $PWD:/data frankwolf/astyle --dry-run ${sources} | grep ^Formatted

  # Doxygen html for the GitHub Pages site (doxygen/), formerly served by codedocs.xyz
  doxygen:
    uses: testillano/workflows/.github/workflows/doxygen.yml@v1
    with:
      doxyfile_dir: docs/doxygen
      doxyfile_overrides: |
        PROJECT_NUMBER=${{ github.ref_name }}

  build_and_push:
    needs: format_style
    name: Build and push docker images
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: docker/login-action@v1
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
        logout: true
    - uses: docker/setup-buildx-action@v2
    - name: Build image
      id: docker_build
      uses: docker/build-push-action@v2
      with:
        tags: ghcr.io/testillano/multipart:local
        file: Dockerfile
        target: build
        context: .
        platforms: linux/amd64
        no-cache: true
        load: true
    - name: Push images
      run: |
        image_tag=${{ github.event.inputs.tag }}
        [ -z "${image_tag}" ] && image_tag=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')
        [[ "${{ github.ref }}" == "refs/tags/"* ]] && image_tag=$(echo $image_tag | sed -e 's/^v//')
        [ "$image_tag" == "master" ] && image_tag=latest
        echo Processed image_tag=$image_tag

        docker tag ghcr.io/testillano/multipart:local ghcr.io/testillano/multipart:${image_tag}
        docker push ghcr.io/testillano/multipart:${image_tag}

  # Deploy the Pages site in a dedicated job on a clean runner: actions/deploy-pages@v4
  # requires the 'github-pages' environment to be declared on the job.
  deploy_pages:
    needs: doxygen
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    # Do not fail the whole pipeline if Pages hiccups:
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    -
      name: Setup Pages
      uses: actions/configure-pages@v3
    -
      name: Download doxygen html
      uses: actions/download-artifact@v4
      with:
        name: ${{ needs.doxygen.outputs.artifact_name }}
        path: site/doxygen
    -
      name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: site
    -
      name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
