name: CI
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker images tag'
        required: true
  push:
    branches:
      - master
    tags:
      - v*.*.*
  pull_request:
    branches:
      - master

jobs:
  format_style:
    name: Check source code format
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run frankwolf format
      run: |
          sources=$(find . -name "*.hpp" -o -name "*.cpp")
          ! docker run -i --rm -v $PWD:/data frankwolf/astyle --dry-run ${sources} | grep ^Formatted

  build_and_push:
    needs: format_style
    name: Build and push docker images
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: docker/login-action@v1
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
        logout: true
    - uses: docker/setup-buildx-action@v2
    - name: Build image
      id: docker_build
      uses: docker/build-push-action@v2
      with:
        tags: ghcr.io/testillano/multipart:local
        file: Dockerfile
        target: build
        context: .
        platforms: linux/amd64
        no-cache: true
        load: true
    - name: Push images
      run: |
        image_tag=${{ github.event.inputs.tag }}
        [ -z "${image_tag}" ] && image_tag=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')
        [[ "${{ github.ref }}" == "refs/tags/"* ]] && image_tag=$(echo $image_tag | sed -e 's/^v//')
        [ "$image_tag" == "master" ] && image_tag=latest
        echo Processed image_tag=$image_tag

        docker tag ghcr.io/testillano/multipart:local ghcr.io/testillano/multipart:${image_tag}
        docker push ghcr.io/testillano/multipart:${image_tag}
